[project]
name = "clausecompass"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dibya-ranjan-samal", email = "dibyaranjansamal510@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "lxml>=6.1.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.0.0",
    "streamlit>=1.62.0",
    "tenacity>=9.1.4",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
    "transformers>=5.15.1",
    "uvicorn>=0.52.4",
]

[project.scripts]
clausecompass = "clausecompass:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.ruff.lint]
# Rules deliberately disabled, with the reason:
#   BLE001 - `except Exception` in fallback paths is intentional. An eval over
#            148 questions must not die because one judge reply was malformed;
#            those handlers record the failure and continue.
#   SIM115 - short-lived reads in scripts; a context manager buys nothing.
#   RUF059 - unpacked-but-unused values in tests document the tuple shape.
#   PLC3002 - one immediately-invoked lambda in a test helper.
ignore = ["BLE001", "SIM115", "RUF059", "PLC3002"]
