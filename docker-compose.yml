# Ollama runs on the HOST, not as a service. It needs the Metal GPU, which does
# not pass through to Linux containers on macOS, and a fourth container would
# not fit alongside the models on an 8 GB machine.
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["./data/qdrant:/qdrant/storage"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      retries: 5

  api:
    build: .
    ports: ["8000:8000"]
    environment:
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_URL=http://host.docker.internal:11434
      # Groq replaces Ollama when set; passed through from the host env or .env
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["./data:/app/data"]
    depends_on:
      qdrant: {condition: service_healthy}

  ui:
    build: .
    command: uv run streamlit run dashboard.py --server.port 8501 --server.address 0.0.0.0
    ports: ["8501:8501"]
    volumes: ["./data:/app/data"]
    depends_on: [api]
